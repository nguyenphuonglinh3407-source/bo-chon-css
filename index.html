<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng bộ chọn CSS</title>
    <!-- Nhúng file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sử dụng ID cho tiêu đề duy nhất -->
    <h1 id="main-title">Trang web của tôi</h1>
    
    <!-- Sử dụng Class cho đoạn văn -->
    <p class="description">Xin chào, tôi là một người đam mê công nghệ và thiết kế web. Tôi luôn thích tạo ra những giao diện đẹp mắt và dễ sử dụng.</p>
    
    <!-- Sử dụng Class cho danh sách -->
    <ul class="hobby-list">
        <li class="hobby-item">Đọc sách</li>
        <li class="hobby-item">Lập trình</li>
        <li class="hobby-item">Du lịch</li>
    </ul>
    
    <!-- Sử dụng ID cho nút bấm chính -->
    <button id="action-btn">Nhấn vào đây</button>

</body>
</html>
